<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>SeedhaPrint jobs</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { background: transparent; font-family: "Segoe UI", Arial, sans-serif; color: #0b1220; user-select: none; overflow: hidden; }
      #box { background: #fff; border: 1px solid #dfe2ea; border-radius: 14px; box-shadow: 0 10px 30px rgba(11, 18, 32, 0.22); overflow: hidden; }
      header { display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 14px; background: #0b1220; color: #fff; }
      header .dots span { display: inline-block; width: 8px; height: 8px; margin-right: 2px; border-radius: 4px; }
      header b { flex: 1; font-size: 13px; letter-spacing: 0.2px; }
      header button { width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: #fff; font-size: 16px; line-height: 1; cursor: pointer; }
      header button:hover { background: rgba(255, 255, 255, 0.15); }
      ul { list-style: none; max-height: 420px; overflow-y: auto; }
      li { display: flex; gap: 12px; padding: 12px 14px; border-top: 1px solid #eef0f4; cursor: pointer; }
      li:first-child { border-top: 0; }
      li:hover { background: #f7f8fa; }
      .code { flex: none; width: 58px; height: 44px; display: grid; place-items: center; border-radius: 10px; background: #f1f2f5; font: 700 18px Consolas, monospace; }
      .body { min-width: 0; flex: 1; }
      .name { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .meta { margin-top: 2px; font-size: 12px; color: #5b6475; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .state { margin-top: 5px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
      .state i { width: 8px; height: 8px; border-radius: 4px; background: #9aa1ae; flex: none; }
      .printing i, .downloading i, .waiting i { background: #0a84c6; animation: pulse 1s ease-in-out infinite alternate; }
      .printed { color: #0a7a4f; } .printed i { background: #0a7a4f; }
      .failed { color: #c2410c; } .failed i { background: #c2410c; }
      .flip { color: #9a5b00; } .flip i { background: #e0a100; animation: pulse 0.6s ease-in-out infinite alternate; }
      .note { margin-top: 4px; font-size: 12px; color: #5b6475; white-space: normal; }
      .go { margin-top: 8px; width: 100%; padding: 9px 12px; border: 0; border-radius: 9px; background: #0b1220; color: #fff; font: 600 13px "Segoe UI", Arial, sans-serif; cursor: pointer; }
      .go:hover { background: #1d2a40; }
      li.alert { background: #fff8e6; }
      @keyframes pulse { from { opacity: 1; } to { opacity: 0.35; } }
    </style>
  </head>
  <body>
    <div id="box">
      <header>
        <span class="dots"><span style="background: #00a3e0"></span><span style="background: #e5007d"></span><span style="background: #ffd200"></span></span>
        <b id="title">New print</b>
        <button id="close" title="Hide">&times;</button>
      </header>
      <ul id="jobs"></ul>
    </div>
    <script src="panel.js"></script>
  </body>
</html>
